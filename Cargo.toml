[package]
name = "melonbot"
version = "0.1.0"
edition = "2024"
description = "Headless Minecraft bots on azalea: a melon farmer, a botswarm, perimeter diggers and villager traders"
license = "MIT"
repository = "https://github.com/FracturedZen/melonbot"

[dependencies]
# Pinned: azalea breaks its API often. 0.16.0+mc26.2, main on 2026-10-06.
# No "log" feature: main.rs owns the tracing subscriber (bevy's LogPlugin would try to set a second one).
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "0bd22cbcdd30b611b112fc1c0a3d78535fd493a1", default-features = false, features = ["online-mode", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
# Gzip + NBT for the schematics: the same versions azalea already builds.
flate2 = { version = "1.1", features = ["zlib-rs"] }
# The changed-slots map of a container click (same version azalea uses).
indexmap = "2"
simdnbt = "0.10"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
regex = "1"
# The control panel server (the Java panel's API, page and key).
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
# MelonBoard's handshake: sign the API's challenge with the Mojang-certified chat key (SHA256withRSA).
# The same versions azalea-auth/azalea-crypto build, so the key type is theirs.
rsa = { version = "0.10.0-rc.19", features = ["sha2"] }
sha2 = "0.11"
base64 = "0.22"
# Same reqwest and TLS stack azalea-auth already pulls in, so there is one of each.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
